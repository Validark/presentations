We want to map %cyan%{IPv4} strings to %white%<[>4%white%<]>%pink%{u8}'s (or %pink%{u32}'s)@so they're compressed and fixed-length:
%yellow%{"0.0.0.0"} %pink%{=>} %white%<[>4%white%<]>%pink%{u8}%white%<{> 0%white%{,} 0%white%{,} 0%white%{,} 0 %white%<}>
%yellow%{"123.45.6.78"} %pink%{=>} %white%<[>4%white%<]>%pink%{u8}%white%<{> 123%white%{,} 45%white%{,} 6%white%{,} 78 %white%<}>
</g>

		<text click="5" id="title2" class="h2" x="980" y="510" text-anchor="middle">Algorithm outline</text>
		<g class="bullets" y="555">
~~~~~%white%{1. Load string into 16 byte vector}
%white%{2. Dot-separated octets => separate 4-byte lanes}
  :4-byte lanes because each octet is up to 3 chars
%white%{3. Within each lane, convert string to byte}
  :Convert each char to its numeric value (%white%{c - '0'})
  :Multiply hundred's place by 100, ten's place by@10, and add them both to the one's place.
    :We have "dot product" instructions for this!!
%white%{4. Reduce each lane back to a byte}
</g>

.LCPI0_1:;;neg
        .zero   16,208
.LCPI0_2:;;dword_index
        .long   2147614976

        .long   2147746562
        .long   2147812355

        .long   2148141320

        .long   2148272906
        .long   2148338699
        .long   2148404492
        .long   2148470285
        .long   2148536078
        .long   2148601871
.LCPI0_5:;;ascii
        .byte   46
.LCPI0_3:;;dec
        .long   174325760
.LCPI0_4:
        .long   1
parse_ip:
        mov          eax, 0x7FFF
        bzhi         eax, eax, esi
        vpbroadcastb xmm0, byte ptr [rip + .LCPI0_5] ; 0x46 = '.'
        kmovd        k1, eax
        vpblendmb    xmm1 {k1}, xmm0, xmmword ptr [rdi]
        vpcmpneqb    k0, xmm1, xmm0
        kshiftlw     k1, k0, 1
        kandnw       k1, k1, k0
        kshiftrw     k2, k0, 1
        kandnw       k2, k2, k0
        vpaddb       xmm0, xmm1, xmmword ptr [rip + .LCPI0_1]
        vmovdqa64    zmm1, zmmword ptr [rip + .LCPI0_2]
        vpcompressd  zmm2 {k1} {z}, zmm1
        vpcompressd  zmm1 {k2} {z}, zmm1
        vpsubb       xmm1, xmm1, xmm2
        vpslld       xmm1, xmm1, 3
        vpshufb      xmm0, xmm0, xmm2
        vpbroadcastd xmm2, dword ptr [rip + .LCPI0_3]
        vpbroadcastd xmm3, dword ptr [rip + .LCPI0_4]
        vpshldvd     xmm3, xmm2, xmm1
        vpxor        xmm1, xmm1, xmm1
        vpdpbusd     xmm1, xmm0, xmm3
        vpmovdb      xmm0, xmm1
        vmovd        eax, xmm0
        ret

	...[...registers64].map((e, i) => [e, i]),
	...[...registers32].map((e, i) => [e, i]),
	...[...registers16].map((e, i) => [e, i]),
	...[...registers8].map((e, i) => [e, i]),
]);

	...[...registers64].map((e, i) => [e, 3]),
	...[...registers32].map((e, i) => [e, 2]),
	...[...registers16].map((e, i) => [e, 1]),

]);

	simd_values = new Array(32).fill([null, 0n]);

	is_gpr_reg(reg) {
		const gpr_index = gpr_mapper.get(reg);

	}

	is_simd_reg(reg) {
		const is_simd_reg = reg.match(/^([xyz])mm(3[01]|[12]?[0-9])$/);
		return is_simd_reg !== null;
	}

	simd_reg_byte_size(reg) {
		const is_simd_reg = reg.match(/^([xyz])mm(3[01]|[12]?[0-9])$/);
		return ({
			x: 16,
			y: 32,
			z: 64,
		})[is_simd_reg?.[1]];
	}

	is_k_reg(reg) {
		const is_k_reg = reg.match(/^k[0-7]$/);
		return is_k_reg !== null;
	}

	is_register(reg) {
		return this.is_gpr_reg(reg) || this.is_simd_reg(reg) || this.is_k_reg(reg);

	get(reg) {
		const gpr_index = gpr_mapper.get(reg);
		if (gpr_index !== undefined) {

					const inputs = [this.get(args[1])[1], this.get(args[2])[1]];
					const contentColor = 'rgb(191, 149, 249)'

					const processed_input_1 = ((1n << (inputs[1] & 0xFFn)) - 1n);
					const result = inputs[0] & processed_input_1;

					const str_input_0 = fnum(16, inputs[0]);

					for (let j = 0; j < 2; j++) {
						const text_content = j ? `& ${fnum(16, processed_input_1, str_input_0.length - 2)}` : "&nbsp;&nbsp;" + str_input_0;

						const textual = createTextual(top_level, {
							x: x - 29,
							y,
							height,
							click, contentColor, text_content,
							delay: ANIM.arrow + j * ANIM.row,
						});

						createArrowH(
							top_level,
							this.get(args[j + 1]),
							[textual, args[0][1]],
							click,
							args[0] == args[j + 1],
							j * ANIM.row,
						);
						//const arrow1 = createArrow(this.get(args[j + 1])[0], {
						//	midpoint: j ? (this.get(args[j + 1])[0].left_side < x ? x - 29 : x - 29 + text_content.length * 16.8) - 8 : x - 29 + (text_content.length / 2) * 16.8,
						//	top_y: (j ? y + 25 : y + 7 - 4),
						//}, click, args[0] === args[j + 1]);
						//top_level.insertAdjacentElement("beforeend", arrow1);

						y += 30;
					}

					y += 10;

					const bzhi_box = createRegisterBox({
						x, y, height,
						content: fnum(16, result, str_input_0.length - 2),
						label: args[0],
						click,
						delay: ANIM.arrow + 2 * ANIM.row,
						content_delay: ANIM.arrow + 2 * ANIM.row + ANIM.box,
						top_level,
					});

					this.set(args[0], [bzhi_box, result]);
					break;
				}

				case "vpblendmb": {
					// e.g. `xmm1 {k1}, xmm0, xmmword ptr [rdi]`
					const [dest, ...decorators] = args[0].split(/\s+/);
					const mask_reg = decorators.map(d => d.match(/^\{(k[1-7])\}$/)?.[1]).find(e => e);
					const zeroing = decorators.includes("{z}");
					const s = this.simd_reg_byte_size(dest);
					const height = 42;
					const contentColor = 'rgb(191, 149, 249)';

					const [src1_e, src1] = this.get(args[1]);
					const [mask_e, mask] = mask_reg ?
						this.get(mask_reg) :
						[null, (1n << BigInt(s)) - 1n];

					// The only memory operand in this demo is the string at [rdi]
					// Bytes past the end of the string are unknown, drawn as a red X
					let src2_e, src2, src2_text, src2_known_len = s;
					if (this.is_register(args[2])) {
						[src2_e, src2] = this.get(args[2]);
						src2_text = to_ascii(src2, s);
					} else {
						const bytes = new TextEncoder().encode(textarea.value).slice(0, s);
						src2 = [...bytes].reduceRight((a, b) => (a << 8n) | BigInt(b), 0n);
						src2_known_len = bytes.length;
						src2_text = String.fromCharCode(...bytes).padEnd(s, 'X');
						const mx = +xmmword_rect.getAttribute("x");
						src2_e = {
							left_side: mx,
							right_side: mx + +xmmword_rect.getAttribute("width"),
							top_y: +xmmword_rect.getAttribute("y"),
							bottom_y: +xmmword_rect.getAttribute("y") + +xmmword_rect.getAttribute("height"),
						};
					}

					let result = 0n;
					for (let j = 0n; j < BigInt(s); j++) {
						const take_src2 = (mask >> j) & 1n;
						const src = take_src2 ? src2 : zeroing ? 0n : src1;
						result |= src & (0xFFn << (8n * j));
					}

					// Each register owns its own column, so a new destination gets a
					// new one after everything else
					const dest_e = this.get(dest)[0];
					const column_e = dest_e;
					const x = dest_e?.left_side ?? top_level_pos;
					let y = Math.max(src1_e.bottom_y, mask_e?.bottom_y ?? 0, src2_e.bottom_y, dest_e?.bottom_y ?? 0) + 30;

					// The source in our column goes first so its straight-down arrow
					// doesn't cross the other rows. Otherwise rightmost first, so the
					// longer drops don't cross the earlier rows.
					const rows = [
						[src1_e, to_ascii(src1, s)],
						[src2_e, src2_text],
						// Bit j lines up with byte j above and below
						[mask_e, to_kmask(mask, s)],
					].sort(([a], [b]) => (b === column_e) - (a === column_e) ||
						(b?.left_side ?? -Infinity) - (a?.left_side ?? -Infinity));

					let t = ANIM.arrow;
					let right_side = 0;
					for (const [from, text_content] of rows) {
						const textual = createTextual(top_level, {
							x: x + 4, y, height,
							click, text_content,
							contentColor: from === mask_e ? contentColor : asciiColor,
							delay: t,
						});
						// Start the arrow so it lands just as its row fades in
						const arrow_delay = t - ANIM.arrow;
						t += ANIM.row;

						if (from === src2_e && src2_known_len < s) {
							textual.textContent = text_content.slice(0, src2_known_len);
							const unknown = apply_attr("tspan", { style: "fill: rgb(255, 85, 85)" });
							unknown.textContent = text_content.slice(src2_known_len);
							textual.appendChild(unknown);
						}

						if (from) arrow_into(from, textual, click, from === column_e, arrow_delay);
						right_side = Math.max(right_side, textual.right_side);

						y += 30;
					}

					y += 10;

					const blend_box = createRegisterBox({
						x, y, height,
						content: to_ascii(result, s),
						contentColor: asciiColor,
						label: dest,
						click,
						delay: t,
						content_delay: t + ANIM.box,
						top_level,
					});

					if (!dest_e) top_level_pos = Math.max(right_side, blend_box.right_side) + 5;
					this.set(dest, [blend_box, result]);
					break;
				}

				case "vpcmpneqb": {
					// e.g. `k0, xmm1, xmm0`, optionally `k0 {k1}, ...` to AND with a mask
					const [dest, ...decorators] = args[0].split(/\s+/);
					const mask_reg = decorators.map(d => d.match(/^\{(k[1-7])\}$/)?.[1]).find(e => e);
					const s = this.simd_reg_byte_size(args[1]);
					const height = 42;

					const [src1_e, src1] = this.get(args[1]);
					const [src2_e, src2] = this.get(args[2]);
					const [mask_e, mask] = mask_reg ?
						this.get(mask_reg) :
						[null, (1n << BigInt(s)) - 1n];

					let result = 0n;
					for (let j = 0n; j < BigInt(s); j++) {
						const a = (src1 >> (8n * j)) & 0xFFn;
						const b = (src2 >> (8n * j)) & 0xFFn;
						if (a !== b) result |= 1n << j;
					}
					result &= mask;

					// A new k register gets its own column after everything else
					const dest_e = this.get(dest)[0];
					const x = dest_e?.left_side ?? top_level_pos;
					let y = Math.max(src1_e.bottom_y, src2_e.bottom_y, mask_e?.bottom_y ?? 0, dest_e?.bottom_y ?? 0) + 30;

					// Rightmost source first, so the longer drops from further left
					// don't cross the horizontal runs of earlier rows.
					const rows = [
						[src1_e, to_ascii(src1, s), asciiColor],
						[src2_e, to_ascii(src2, s), asciiColor],
						...(mask_e ? [[mask_e, to_kmask(mask, s), 'rgb(191, 149, 249)']] : []),
					].sort(([a], [b]) => b.left_side - a.left_side);

					let right_side = 0;
					let t = ANIM.arrow;
					for (const [from, text_content, contentColor] of rows) {
						const textual = createTextual(top_level, {
							x: x + 4, y, height,
							click, contentColor, text_content,
							delay: t,
						});
						arrow_into(from, textual, click, from === dest_e, t - ANIM.arrow);
						t += ANIM.row;
						right_side = Math.max(right_side, textual.right_side);
						y += 30;
					}

					y += 10;

					const cmp_box = createRegisterBox({
						x, y, height,
						content: to_kmask(result, s),
						label: dest,
						click,
						delay: t,
						content_delay: t + ANIM.box,
						top_level,
					});

					if (!dest_e) top_level_pos = Math.max(right_side, cmp_box.right_side) + 5;
					this.set(dest, [cmp_box, result]);
					break;
				}

				case "kshiftlb": case "kshiftlw": case "kshiftld": case "kshiftlq":
				case "kshiftrb": case "kshiftrw": case "kshiftrd": case "kshiftrq": {
					// e.g. `k1, k0, 1`
					const [dest, src, imm] = args;
					const bits = ({ b: 8, w: 16, d: 32, q: 64 })[mnemonic.at(-1)];
					const width_mask = (1n << BigInt(bits)) - 1n;
					const count = BigInt(imm);
					const height = 42;

					const [src_e, src_v] = this.get(src);
					// Shifting left moves bits towards higher indices, which is to
					// the right in memory order.
					const result = count >= BigInt(bits) ? 0n :
						mnemonic[6] === 'l' ?
							(src_v << count) & width_mask :
							(src_v & width_mask) >> count;

					const dest_e = this.get(dest)[0];
					const x = dest_e?.left_side ?? top_level_pos;
					let y = Math.max(src_e.bottom_y, dest_e?.bottom_y ?? 0) + 30;

					const textual = createTextual(top_level, {
						x: x + 4, y, height,
						click,
						contentColor: 'rgb(191, 149, 249)',
						text_content: to_kmask(src_v & width_mask, bits),
						delay: ANIM.arrow,
					});
					arrow_into(src_e, textual, click, src_e === dest_e);

					y += 30;

					const is_left = mnemonic[6] === 'l';
					createTextual(top_level, {
						x: x + 4, y, height,
						click,
						contentColor: 'rgb(255, 121, 198)',
						text_content: `${is_left ? '<<' : '>>'} ${count}`,
						delay: ANIM.arrow + ANIM.row,
					});

					y += 30 + 10;

					const result_text = to_kmask(result, bits);
					const shift_box_delay = ANIM.arrow + 2 * ANIM.row;
					const shift_box = createRegisterBox({
						x, y, height,
						content: result_text,
						label: dest,
						click,
						delay: shift_box_delay,
						content_delay: shift_box_delay + ANIM.box,
						top_level,
					});

					// The box starts out showing the source bits. Then the bits that
					// fall off the end collapse and fade out while the shifted-in
					// zeros fade in and open up on the other side, so the rest of
					// the bits visibly slide over.
					const n_in = Number(count < BigInt(bits) ? count : BigInt(bits));
					if (n_in > 0) {
						const src_text = to_kmask(src_v & width_mask, bits);
						const in_id = `shift-in-${click}`;
						const out_id = `shift-out-${click}`;
						const shifted_in = apply_attr('tspan', { id: in_id });
						const shifted_out = apply_attr('tspan', { id: out_id });
						shifted_in.textContent = '0'.repeat(n_in);

						if (is_left) {
							shifted_out.textContent = src_text.slice(bits - n_in);
							shift_box.content_box.replaceChildren(shifted_in, src_text.slice(0, bits - n_in), shifted_out);
						} else {
							shifted_out.textContent = src_text.slice(0, n_in);
							shift_box.content_box.replaceChildren(shifted_out, src_text.slice(n_in), shifted_in);
						}

						// -1ch cancels out exactly one character's advance, so a
						// collapsed tspan takes up no room at all.
						const collapsed = { "letter-spacing": "-1ch", opacity: 0 };
						const normal = { "letter-spacing": "0ch", opacity: 1 };
						for (const [id, keyframes] of [[in_id, { 0: collapsed, 100: normal }], [out_id, { 0: normal, 100: collapsed }]]) {
							global_animations.push({
								section: 'assembly-1-overlay',
								selector: `#${id}`,
								slide_num: click,
								continuous: true,
								// Once the rest of the value has faded in
								animation_delay: `${shift_box_delay + ANIM.box + ANIM.fade}s`,
								animation_duration: "0.6s",
								keyframes,
							});
						}
					}

					if (!dest_e) top_level_pos = Math.max(textual.right_side, shift_box.right_side) + 5;
					this.set(dest, [shift_box, result]);
					break;
				}

				case "kandb": case "kandw": case "kandd": case "kandq":
				case "kandnb": case "kandnw": case "kandnd": case "kandnq":
				case "korb": case "korw": case "kord": case "korq":
				case "kxorb": case "kxorw": case "kxord": case "kxorq":
				case "kxnorb": case "kxnorw": case "kxnord": case "kxnorq": {
					// e.g. `k1, k1, k0`
					const [dest, src1, src2] = args;
					const bits = ({ b: 8, w: 16, d: 32, q: 64 })[mnemonic.at(-1)];
					const width_mask = (1n << BigInt(bits)) - 1n;
					const op = mnemonic.slice(1, -1);
					const height = 42;

					const [src1_e, a] = this.get(src1);
					const [src2_e, b] = this.get(src2);
					// The operator is drawn before the second row. andn's NOT applies to
					// src1, so for it src1 is drawn second, as `src2 & ~src1`.
					let [result, prefix, swap] = ({
						and:  [a & b,    "&",   false],
						andn: [~a & b,   "& ~", true],
						or:   [a | b,    "|",   false],
						xor:  [a ^ b,    "^",   false],
						xnor: [~(a ^ b), "^ ~", false],
					})[op];
					result &= width_mask;

					const dest_e = this.get(dest)[0];
					const x = dest_e?.left_side ?? top_level_pos;
					let y = Math.max(src1_e.bottom_y, src2_e.bottom_y, dest_e?.bottom_y ?? 0) + 30;

					// Otherwise, the source in our column goes first so its straight-down
					// arrow doesn't cross the other row.
					const rows = swap ?
						[[src2_e, b], [src1_e, a]] :
						[[src1_e, a], [src2_e, b]].sort(([p], [q]) => (q === dest_e) - (p === dest_e));

					let right_side = 0;
					for (const [j, [from, v]] of rows.entries()) {
						const row_delay = ANIM.arrow + j * ANIM.row;
						const textual = createTextual(top_level, {
							x: x + 4, y, height,
							click,
							contentColor: 'rgb(191, 149, 249)',
							text_content: to_kmask(v & width_mask, bits),
							delay: row_delay,
						});

						let prefix_left = textual.left_side;
						const op_gap = 0;
						if (j === 1) {
							const op_e = createTextual(top_level, {
								x: textual.left_side - op_gap, y, height,
								click,
								contentColor: 'rgb(255, 121, 198)',
								text_content: prefix,
								delay: row_delay,
							});
							op_e.setAttribute('text-anchor', 'end');
							prefix_left = textual.left_side - op_gap - prefix.length * 16.8;
						}

						if (from === dest_e && j !== 0) {
							// Directly above but not the first row: coming straight down
							// would cut through the first row, so leave the bottom left
							// of the box, swing out left past the operator, and come in
							// from the left.
							const r = 10;
							const x1 = from.left_side + 18;
							const y1 = from.bottom_y + 8;
							const ya = from.bottom_y + 18;
							const x2 = prefix_left - 19;
							const xl = x2 - 2 * r;
							const yt = (textual.top_y + textual.bottom_y) / 2;
							top_level.insertAdjacentElement("beforeend", createArrow(from, null, click, false,
								// Corners are diagonal cuts, matching createArrow's
								`M ${x1} ${y1} V ${ya - r} L ${x1 - r} ${ya} H ${xl + r} ` +
								`L ${xl} ${ya + r} V ${yt - r} L ${xl + r} ${yt} H ${x2}`,
								row_delay - ANIM.arrow,
							));
						} else {
							arrow_into(from, textual, click, from === dest_e, row_delay - ANIM.arrow);
						}
						right_side = Math.max(right_side, textual.right_side);
						y += 30;
					}

					y += 10;

					const logic_box = createRegisterBox({
						x, y, height,
						content: to_kmask(result, bits),
						label: dest,
						click,
						delay: ANIM.arrow + rows.length * ANIM.row,
						content_delay: ANIM.arrow + rows.length * ANIM.row + ANIM.box,
						top_level,
					});

					if (!dest_e) top_level_pos = Math.max(right_side, logic_box.right_side) + 5;
					this.set(dest, [logic_box, result]);
					break;
				}

				case "vmovdqa": case "vmovdqa32": case "vmovdqa64": {
					// e.g. `zmm1, zmmword ptr [rip + .LCPI0_2]`
					const [dest, src] = args;
					const s = this.simd_reg_byte_size(dest);

					let value, options = [];
					if (this.is_register(src)) {
						value = this.get(src)[1];
					} else {
						const label = m_label(src);
						if (!label) throw new Error("Unsupported operand " + src);
						value = this.constant_pool.get(label);
						options = this.rendering_options.get(label) ?? [];
					}

					// `dword_index`: drawn as a grid of dwords (see fill_dword_grid)
					const by_dword = options.includes("dword_index");
					const content = by_dword ? 'X'.repeat(s / 4) : to_ascii(value, s);

					// zmm1 shares xmm1's column, but goes below everything so it
					// doesn't land on the arrows coming out of xmm1
					const dest_e = this.get(dest)[0];
					const mov_y = lowest_y() + 20;
					const mov_box = createRegisterBox({
						x: dest_e?.left_side ?? top_level_pos,
						y: mov_y,
						height: by_dword ? GRID_HEIGHT : 42,
						content,
						contentColor: options.includes("dword_index") ? digitColor : asciiColor,
						label: dest,
						click,
						content_delay: ANIM.box,
						top_level,
					});

					if (by_dword) {
						fill_dword_grid(mov_box.content_box, value, s / 4, mov_y);
						mov_box.numeric = true;
					}

					if (!dest_e) top_level_pos = mov_box.right_side + 5;
					this.set(dest, [mov_box, value]);
					break;
				}

				case "vpcompressd": {
					// e.g. `zmm2 {k1} {z}, zmm1`: pack the dwords picked by k1 down
					// to the start, then zero (or keep, without {z}) the rest
					const [dest, ...decorators] = args[0].split(/\s+/);
					const mask_reg = decorators.map(d => d.match(/^\{(k[1-7])\}$/)?.[1]).find(e => e);
					const zeroing = decorators.includes("{z}");
					const n = this.simd_reg_byte_size(dest) / 4;

					const [src_e, src_v] = this.get(args[1]);
					const [mask_e, mask] = mask_reg ?
						this.get(mask_reg) :
						[null, (1n << BigInt(n)) - 1n];
					const [dest_e, dest_v] = this.get(dest);

					const dword = (v, j) => (v >> BigInt(32 * j)) & 0xFFFFFFFFn;
					let result = 0n, packed = 0;
					for (let j = 0; j < n; j++) {
						if ((mask >> BigInt(j)) & 1n) result |= dword(src_v, j) << BigInt(32 * packed++);
					}
					for (let j = packed; j < n; j++) {
						if (!zeroing) result |= dword(dest_v ?? 0n, j) << BigInt(32 * j);
					}

					const x = dest_e?.left_side ?? top_level_pos;
					let y = Math.max(src_e.bottom_y, mask_e?.bottom_y ?? 0, dest_e?.bottom_y ?? 0) + 30;

					// A source in our own column goes first so its straight-down
					// arrow doesn't cut through the other row; otherwise rightmost
					// first, so the longer drops don't cross the earlier rows
					const rows = [[src_e, true], ...(mask_e ? [[mask_e, false]] : [])]
						.sort(([a], [b]) => (b === dest_e) - (a === dest_e) || b.left_side - a.left_side);

					let right_side = 0;
					for (const [j, [from, is_grid]] of rows.entries()) {
						const row_delay = ANIM.arrow + j * ANIM.row;
						const textual = createTextual(top_level, {
							x: x + 4, y,
							height: is_grid ? GRID_HEIGHT : 42,
							click,
							contentColor: is_grid ? digitColor : 'rgb(191, 149, 249)',
							text_content: is_grid ? 'X'.repeat(n) : to_kmask(mask, n),
							delay: row_delay,
						});
						// Dim the dwords the mask doesn't pick
						if (is_grid) fill_dword_grid(textual, src_v, n, y, j => !((mask >> BigInt(j)) & 1n));
						arrow_into(from, textual, click, from === dest_e, row_delay - ANIM.arrow);
						right_side = Math.max(right_side, textual.right_side);
						y += (is_grid ? GRID_HEIGHT - 42 : 0) + 30;
					}

					y += 10;

					const compress_box_delay = ANIM.arrow + rows.length * ANIM.row;
					const compress_box = createRegisterBox({
						x, y,
						height: GRID_HEIGHT,
						content: 'X'.repeat(n),
						contentColor: digitColor,
						label: dest,
						click,
						delay: compress_box_delay,
						content_delay: compress_box_delay + ANIM.box,
						top_level,
					});
					// Dim the zeroed tail
					fill_dword_grid(compress_box.content_box, result, n, y, j => zeroing && j >= packed);
					compress_box.numeric = true;

					if (!dest_e) top_level_pos = Math.max(right_side, compress_box.right_side) + 5;
					this.set(dest, [compress_box, result]);
					break;
				}

				case "vpshufb": {
					// e.g. `xmm0, xmm0, xmm2`: byte i = table[index[i] & 15], or 0 if
					// index[i] has its top bit set (within each 16-byte lane)
					const [dest, table, index] = args;
					const s = this.simd_reg_byte_size(dest);

					const [table_e, table_v] = this.get(table);
					const [index_e, index_v] = this.get(index);
					const byte = (v, i) => (v >> BigInt(8 * i)) & 0xFFn;

					let result = 0n;
					for (let i = 0; i < s; i++) {
						const idx = byte(index_v, i);
						const lane = i & ~15;
						if (!(idx & 0x80n)) result |= byte(table_v, lane + Number(idx & 15n)) << BigInt(8 * i);
					}

					// Numeric indices (rather than ASCII) give a numeric result
					const as_num = !!index_e.numeric;

					const dest_e = this.get(dest)[0];
					const x = dest_e?.left_side ?? top_level_pos;
					// Below everything so far (not just its operands), so the rows
					// don't sit alongside whatever was drawn in the other columns
					let y = lowest_y() + 30;

					// Same ordering as vpcompressd
					const rows = [table_e, index_e]
						.sort((a, b) => (b === dest_e) - (a === dest_e) || b.left_side - a.left_side);

					let right_side = 0;
					for (const [j, from] of rows.entries()) {
						const row_delay = ANIM.arrow + j * ANIM.row;
						const is_num = from === index_e && as_num;
						const textual = createTextual(top_level, {
							x: x + 4, y,
							height: is_num ? num_height(s) : 42,
							click,
							contentColor: is_num ? digitColor : asciiColor,
							text_content: 'X'.repeat(is_num ? num_chars(s) : s),
							delay: row_delay,
						});
						if (is_num) fill_num(textual, index_v, s, y);
						else fill_bytes(textual, from === index_e ? index_v : table_v, s);
						arrow_into(from, textual, click, from === dest_e, row_delay - ANIM.arrow);
						right_side = Math.max(right_side, textual.right_side);
						y += (is_num ? num_height(s) - 42 : 0) + 30;
					}

					y += 10;

					const shuf_box_delay = ANIM.arrow + rows.length * ANIM.row;
					const shuf_box = createRegisterBox({
						x, y,
						height: as_num ? num_height(s) : 42,
						content: 'X'.repeat(as_num ? num_chars(s) : s),
						contentColor: digitColor,
						label: dest,
						click,
						delay: shuf_box_delay,
						content_delay: shuf_box_delay + ANIM.box,
						top_level,
					});
					if (as_num) {
						// Dim the bytes that were zeroed by a ~ index
						fill_num(shuf_box.content_box, result, s, y,
							(j, k) => !!(byte(index_v, 4 * j + k) & 0x80n));
						shuf_box.numeric = true;
					} else {
						fill_bytes(shuf_box.content_box, result, s);
					}

					if (!dest_e) top_level_pos = Math.max(right_side, shuf_box.right_side) + 5;
					this.set(dest, [shuf_box, result]);
					break;
				}

				case "vpbroadcastd": {
					// e.g. `xmm2, dword ptr [rip + .LCPI0_3]`: copy one dword into
					// every dword, drawn as a dword grid
					const [dest, src] = args;
					const s = this.simd_reg_byte_size(dest);
					const n = s / 4;

					const label = m_label(src);
					if (!label) throw new Error("Unsupported operand " + src);
					const d = this.constant_pool.get(label) & 0xFFFFFFFFn;
					const options = this.rendering_options.get(label) ?? [];
					// `dec`: bytes too big for one base-32 digit
					const w = options.includes("dec") ? 3 : 1;

					let value = 0n;
					for (let j = 0; j < n; j++) value |= d << BigInt(32 * j);

					// Below everything, so it doesn't land on arrows coming out of
					// boxes higher up in its column
					const dest_e = this.get(dest)[0];
					const bc_y = lowest_y() + 20;
					const bc_box = createRegisterBox({
						x: dest_e?.left_side ?? top_level_pos,
						y: bc_y,
						height: num_height(s),
						content: 'X'.repeat(num_chars(s, w)),
						contentColor: digitColor,
						label: dest,
						click,
						content_delay: ANIM.box,
						top_level,
					});
					fill_num(bc_box.content_box, value, s, bc_y, undefined, w);
					bc_box.numeric = true;
					bc_box.grid_width = w;

					if (!dest_e) top_level_pos = bc_box.right_side + 5;
					this.set(dest, [bc_box, value]);
					break;
				}

				case "vpshldvd": {
					// e.g. `xmm3, xmm2, xmm1`: per dword, join dest (high) onto src2
					// (low), shift left by src3, and keep the high half. Bytes go
					// down the grid low first, so src2's grid sits directly on top
					// of dest's to make one 8-byte column per dword.
					const [dest, src2, src3] = args;
					const s = this.simd_reg_byte_size(dest);
					const n = s / 4;

					const [dest_e, dest_v] = this.get(dest);
					const [src2_e, src2_v] = this.get(src2);
					const [src3_e, src3_v] = this.get(src3);
					const dword = (v, j) => (v >> BigInt(32 * j)) & 0xFFFFFFFFn;

					let result = 0n;
					for (let j = 0; j < n; j++) {
						const joined = (dword(dest_v, j) << 32n) | dword(src2_v, j);
						const shifted = (joined << (dword(src3_v, j) & 31n)) >> 32n;
						result |= (shifted & 0xFFFFFFFFn) << BigInt(32 * j);
					}

					// Everything at the widest cell width, so the columns line up
					const w = Math.max(...[dest_e, src2_e, src3_e].map(e => e?.grid_width ?? 1));
					const chars = num_chars(s, w);
					const op_color = 'rgb(255, 121, 198)';

					const x = dest_e?.left_side ?? top_level_pos;
					let y = Math.max(dest_e?.bottom_y ?? 0, src2_e.bottom_y, src3_e.bottom_y) + 30;

					const rows = [
						[src2_e, src2_v, undefined],
						[dest_e, dest_v, undefined],
						// Only the low 5 bits of each count matter, so dim the rest
						[src3_e, src3_v, (j, k) => k > 0],
					];
					const op = "<<";
					let right_side = 0;
					for (const [j, [from, v, dim]] of rows.entries()) {
						const row_delay = ANIM.arrow + j * ANIM.row;
						const textual = createTextual(top_level, {
							x: x + 4, y,
							height: num_height(s),
							click,
							contentColor: digitColor,
							text_content: 'X'.repeat(chars),
							delay: row_delay,
						});
						fill_num(textual, v, s, y, dim, w);

						const is_count = from === src3_e;
						if (is_count) {
							const op_e = createTextual(top_level, {
								x: textual.left_side, y: y + (num_height(s) - 42) / 2, height: 42,
								click,
								contentColor: op_color,
								text_content: op,
								delay: row_delay,
							});
							op_e.setAttribute('text-anchor', 'end');
						}

						const arrow_delay = row_delay - ANIM.arrow;
						if (from === dest_e && j !== 0) {
							arrow_around(from, textual, click, arrow_delay);
						} else {
							arrow_into(from, textual, click, from === dest_e, arrow_delay,
								is_count ? op.length * 16.8 + 4 : 0);
						}

						right_side = Math.max(right_side, textual.right_side);
						y += num_height(s) - 42 + 30;
						// The two halves touch, with the count row after a gap
						if (j === 1) y += 10;
					}

					y += 10;

					const shld_box_delay = ANIM.arrow + rows.length * ANIM.row;
					const shld_box = createRegisterBox({
						x, y,
						height: num_height(s),
						content: 'X'.repeat(chars),
						contentColor: digitColor,
						label: dest,
						click,
						delay: shld_box_delay,
						content_delay: shld_box_delay + ANIM.box,
						top_level,
					});
					fill_num(shld_box.content_box, result, s, y, undefined, w);
					shld_box.numeric = true;
					shld_box.grid_width = w;

					if (!dest_e) top_level_pos = Math.max(right_side, shld_box.right_side) + 5;
					this.set(dest, [shld_box, result]);
					break;
				}

				case "vpdpbusd": {
					// e.g. `xmm1, xmm0, xmm3`: per dword, multiply the 4 unsigned bytes
					// of src1 by the 4 signed bytes of src2 and add them all onto
					// dest. Down a column that's the dot product, so the digits
					// times 100, 10, 1 become the number.
					const [dest, src1, src2] = args;
					const s = this.simd_reg_byte_size(dest);
					const n = s / 4;

					const [dest_e, dest_v] = this.get(dest);
					const [src1_e, src1_v] = this.get(src1);
					const [src2_e, src2_v] = this.get(src2);
					const byte = (v, j, k) => (v >> BigInt(32 * j + 8 * k)) & 0xFFn;

					let result = 0n;
					for (let j = 0; j < n; j++) {
						let sum = (dest_v >> BigInt(32 * j)) & 0xFFFFFFFFn;
						for (let k = 0; k < 4; k++)
							sum += byte(src1_v, j, k) * BigInt.asIntN(8, byte(src2_v, j, k));
						result |= BigInt.asUintN(32, sum) << BigInt(32 * j);
					}

					// Multiply first: one product per byte, in the same grid shape
					const product = (j, k) => byte(src1_v, j, k) * BigInt.asIntN(8, byte(src2_v, j, k));
					const w = Math.max(3, ...[dest_e, src1_e, src2_e].map(e => e?.grid_width ?? 1),
						...Array.from({ length: n * 4 }, (_, i) => String(product(i >> 2, i & 3)).length),
						...Array.from({ length: n }, (_, j) => String((result >> BigInt(32 * j)) & 0xFFFFFFFFn).length));
					const chars = num_chars(s, w);
					const op_color = 'rgb(255, 121, 198)';
					const op_pad = op => op.length * 16.8 + 4;

					const x = dest_e?.left_side ?? top_level_pos;
					let y = Math.max(dest_e?.bottom_y ?? 0, src1_e.bottom_y, src2_e.bottom_y) + 30;
					let right_side = 0;

					// One row (or grid) of numbers, with an optional operator before it
					const row = (op, height, delay, fill) => {
						const textual = createTextual(top_level, {
							x: x + 4, y,
							height,
							click,
							contentColor: digitColor,
							text_content: 'X'.repeat(chars),
							delay,
						});
						fill(textual, y);
						if (op) {
							const op_e = createTextual(top_level, {
								x: textual.left_side, y: y + (height - 42) / 2, height: 42,
								click,
								contentColor: op_color,
								text_content: op,
								delay,
							});
							op_e.setAttribute('text-anchor', 'end');
						}
						right_side = Math.max(right_side, textual.right_side);
						y += height - 42 + 30;
						return textual;
					};

					// The two operands
					const src1_delay = ANIM.arrow;
					const src1_row = row(null, num_height(s), src1_delay,
						(t, top_y) => fill_num(t, src1_v, s, top_y, undefined, w));
					arrow_into(src1_e, src1_row, click, src1_e === dest_e, src1_delay - ANIM.arrow);

					const src2_delay = src1_delay + ANIM.row;
					const src2_row = row("×", num_height(s), src2_delay,
						(t, top_y) => fill_num(t, src2_v, s, top_y, undefined, w));
					arrow_into(src2_e, src2_row, click, false, src2_delay - ANIM.arrow, op_pad("×"));

					// A dotted line under the operands, like long multiplication
					const line_delay = src2_delay + ANIM.row;
					const line_y = y + 16;
					const line = apply_attr('line', {
						class: 'no-slide-in',
						click,
						x1: src2_row.left_side - op_pad("×"), y1: line_y,
						x2: src2_row.right_side, y2: line_y,
						stroke: 'rgb(248, 248, 242)',
						stroke_width: 2,
						stroke_dasharray: '4 6',
					});
					top_level.insertAdjacentElement("beforeend", line);
					fade_in(line, click, line_delay);

					// The products under it, as an intermediate result
					y += 16;
					const products_delay = line_delay + ANIM.fade;
					row("=", num_height(s), products_delay,
						(t, top_y) => fill_cells(t, s, top_y, w, product));

					// Then the accumulator comes in last, and adds onto each column's sum
					y += 10;
					const acc_delay = products_delay + ANIM.row + ANIM.arrow;
					const acc_row = row("+", 42, acc_delay, t => fill_dwords(t, dest_v, n, w));
					if (dest_e) arrow_around(dest_e, acc_row, click, acc_delay - ANIM.arrow);

					y += 10;

					const dp_box_delay = acc_delay + ANIM.row;
					// The result as a grid too, so each dword's bytes go down its column
					const dp_box = createRegisterBox({
						x, y,
						height: GRID_HEIGHT,
						content: 'X'.repeat(chars),
						contentColor: digitColor,
						label: dest,
						click,
						delay: dp_box_delay,
						content_delay: dp_box_delay + ANIM.box,
						top_level,
					});
					fill_dword_grid(dp_box.content_box, result, n, y, undefined, w);
					dp_box.numeric = true;
					dp_box.grid_width = w;

					if (!dest_e) top_level_pos = Math.max(right_side, dp_box.right_side) + 5;
					this.set(dest, [dp_box, result]);
					break;
				}

				case "vpmovdb": {
					// e.g. `xmm0, xmm1`: keep the low byte of each dword, packed
					// into the low bytes of dest (the rest is zeroed). With src as a
					// grid, those are its first row: the other rows fade away and
					// dest's box draws around what's left.
					const [dest, src] = args;
					const n_src = this.simd_reg_byte_size(src) / 4;

					const [src_e, src_v] = this.get(src);
					let result = 0n;
					for (let j = 0; j < n_src; j++)
						result |= ((src_v >> BigInt(32 * j)) & 0xFFn) << BigInt(8 * j);

					const w = Math.max(3, src_e.grid_width ?? 1);
					const chars = grid_chars(n_src, w);
					const dest_e = this.get(dest)[0];
					const x = dest_e?.left_side ?? top_level_pos;
					const y = Math.max(src_e.bottom_y, dest_e?.bottom_y ?? 0) + 30;

					const textual = createTextual(top_level, {
						x: x + 4, y,
						height: GRID_HEIGHT,
						click,
						contentColor: digitColor,
						text_content: 'X'.repeat(chars),
						delay: ANIM.arrow,
					});
					fill_dword_grid(textual, src_v, n_src, y, undefined, w);
					// At the first row, since that's all that'll be left
					arrow_into(src_e, { left_side: textual.left_side, right_side: textual.right_side,
						top_y: y, bottom_y: y + 42 }, click, src_e === dest_e);

					// The high bytes fade away
					const drop_delay = ANIM.arrow + ANIM.row + ANIM.fade;
					for (const [k, line] of [...textual.children].entries()) {
						if (k === 0) continue;
						line.setAttribute('id', `movdb-${click}-${k}`);
						global_animations.push({
							section: 'assembly-1-overlay',
							selector: `#${line.id}`,
							slide_num: click,
							continuous: true,
							animation_delay: `${drop_delay}s`,
							animation_duration: `${ANIM.fade}s`,
							keyframes: {
								0:   { opacity: 1 },
								100: { opacity: 0 },
							},
						});
					}

					// Then dest's box goes around the first row, which is already
					// drawn, so the box itself has no text of its own
					const movdb_box = createRegisterBox({
						x, y,
						height: 42,
						content: ' '.repeat(chars),
						label: dest,
						click,
						delay: drop_delay + ANIM.fade,
						top_level,
					});
					movdb_box.numeric = true;
					movdb_box.grid_width = w;

					if (!dest_e) top_level_pos = Math.max(textual.right_side, movdb_box.right_side) + 5;
					this.set(dest, [movdb_box, result]);
					break;
				}

				case "vpslld": case "vpsrld": {
					// e.g. `xmm1, xmm1, 3`: shift each dword by an immediate
					const [dest, src, imm] = args;
					const s = this.simd_reg_byte_size(dest);
					const n = s / 4;
					const count = BigInt(imm);
					const is_left = mnemonic === "vpslld";

					const [src_e, src_v] = this.get(src);
					let result = 0n;
					for (let j = 0; j < n; j++) {
						const d = (src_v >> BigInt(32 * j)) & 0xFFFFFFFFn;
						const shifted = count >= 32n ? 0n : is_left ? (d << count) & 0xFFFFFFFFn : d >> count;
						result |= shifted << BigInt(32 * j);
					}

					const as_num = !!src_e.numeric;
					const row_height = as_num ? num_height(s) : 42;
					const draw = (text, v, top_y) => as_num ?
						fill_num(text, v, s, top_y) :
						fill_bytes(text, v, s);

					const dest_e = this.get(dest)[0];
					const x = dest_e?.left_side ?? top_level_pos;
					let y = Math.max(src_e.bottom_y, dest_e?.bottom_y ?? 0) + 30;

					const textual = createTextual(top_level, {
						x: x + 4, y,
						height: row_height,
						click,
						contentColor: as_num ? digitColor : asciiColor,
						text_content: 'X'.repeat(as_num ? num_chars(s) : s),
						delay: ANIM.arrow,
					});
					draw(textual, src_v, y);
					arrow_into(src_e, textual, click, src_e === dest_e);

					y += row_height - 42 + 30;

					// The shift amount goes on its own line under the operand, like kshift
					createTextual(top_level, {
						x: x + 4, y, height: 42,
						click,
						contentColor: 'rgb(255, 121, 198)',
						text_content: `${is_left ? '<<' : '>>'} ${count}`,
						delay: ANIM.arrow + ANIM.row,
					});

					y += 30 + 10;

					const sll_box_delay = ANIM.arrow + 2 * ANIM.row;
					const sll_box = createRegisterBox({
						x, y,
						height: row_height,
						content: 'X'.repeat(as_num ? num_chars(s) : s),
						contentColor: digitColor,
						label: dest,
						click,
						delay: sll_box_delay,
						content_delay: sll_box_delay + ANIM.box,
						top_level,
					});
					draw(sll_box.content_box, result, y);
					sll_box.numeric = as_num;

					if (!dest_e) top_level_pos = Math.max(textual.right_side, sll_box.right_side) + 5;
					this.set(dest, [sll_box, result]);
					break;
				}

				case "vpaddb": case "vpsubb": case "vpxor": case "vpand": case "vpor": {
					// e.g. `xmm0, xmm1, xmmword ptr [rip + .LCPI0_1]`
					const [dest, src1, src2] = args;
					const s = this.simd_reg_byte_size(dest);
					const height = 42;
					const n = s / 4;

					// `vpxor xmm1, xmm1, xmm1` just makes a zero, so draw a zero box
					// with nothing flowing in. It's drawn as one row of dword values, since
					// it's usually an accumulator.
					if (src1 === src2 && (mnemonic === "vpxor" || mnemonic === "vpsubb")) {
						const dest_e = this.get(dest)[0];
						const w = 3;
						const zero_y = lowest_y() + 20;
						const zero_box = createRegisterBox({
							x: dest_e?.left_side ?? top_level_pos,
							y: zero_y,
							height,
							content: 'X'.repeat(grid_chars(n, w)),
							contentColor: digitColor,
							label: dest,
							click,
							content_delay: ANIM.box,
							top_level,
						});
						fill_dwords(zero_box.content_box, 0n, n, w);
						zero_box.dword_values = true;
						zero_box.grid_width = w;

						if (!dest_e) top_level_pos = zero_box.right_side + 5;
						this.set(dest, [zero_box, 0n]);
						break;
					}

					const [op_text, op_fn] = ({
						vpaddb: ["+", (a, b) => a + b],
						vpsubb: ["-", (a, b) => a - b],
						vpxor:  ["^", (a, b) => a ^ b],
						vpand:  ["&", (a, b) => a & b],
						vpor:   ["|", (a, b) => a | b],
					})[mnemonic];
					let shown_op = op_text;

					const [src1_e, src1_v] = this.get(src1);

					// The second operand is either a register or a constant. A `neg`
					// constant is drawn negated with the operator flipped, so adding
					// 208s reads as subtracting '0's.
					let src2_e = null, src2_v;
					if (this.is_register(src2)) {
						[src2_e, src2_v] = this.get(src2);
					} else {
						const m = src2.match(/^\w+ ptr \[rip \+ \.(LCPI\d+_\d+)\]/);
						if (!m) throw new Error("Unsupported operand " + src2);
						src2_v = this.constant_pool.get(m[1]);
					}
					let shown2 = src2_v;
					if (!src2_e && (this.rendering_options.get(m_label(src2)) ?? []).includes("neg") &&
							(op_text === "+" || op_text === "-")) {
						shown2 = bytewise(src2_v, s, b => -b);
						shown_op = op_text === "+" ? "-" : "+";
					}

					const result = bytewise(src1_v, s, (a, j) => op_fn(a, (src2_v >> (8n * j)) & 0xFFn));

					const dest_e = this.get(dest)[0];
					const x = dest_e?.left_side ?? top_level_pos;
					// Start below everything drawn so far, so the arrow from xmm1
					// doesn't cut through the k mask work
					let y = lowest_y() + 30;

					// Operands drawn as dword grids (e.g. the vpcompressd results) are
					// added/subtracted as grids, giving a grid
					const as_num = !!(src1_e?.numeric || src2_e?.numeric);
					const row_height = as_num ? num_height(s) : height;
					const w = Math.max(src1_e?.grid_width ?? 1, src2_e?.grid_width ?? 1);

					const rows = [[src1_e, src1_v], [src2_e, shown2]];
					let right_side = 0;
					for (const [j, [from, v]] of rows.entries()) {
						const row_delay = ANIM.arrow + j * ANIM.row;
						const textual = createTextual(top_level, {
							x: x + 4, y,
							height: row_height,
							click,
							text_content: as_num ? 'X'.repeat(num_chars(s, w)) : to_ascii(v, s),
							contentColor: as_num ? digitColor : asciiColor,
							delay: row_delay,
						});
						if (as_num) fill_num(textual, v, s, y, undefined, w);

						if (j === 1) {
							// Vertically centred, in case it's a grid
							const op_e = createTextual(top_level, {

						content_delay: add_box_delay + ANIM.box,

					});

			const new_drawn = drawn.slice(drawn_before);
			const new_arrows = drawn_arrows.slice(arrows_before);
			if (new_drawn.length) {
				const margin = 20;
				const W = VIEW.right - VIEW.left - 2 * margin;
				const H = VIEW.bottom - VIEW.top - 2 * margin;
				const bounds = es => ({
					left:   Math.min(...es.map(e => e.left_side)),
					right:  Math.max(...es.map(e => e.right_side)),
					top:    Math.min(...es.map(e => e.top_y)),
					bottom: Math.max(...es.map(e => e.bottom_y)),
				});

				// Move as little as possible from where we are: if it's already in
				// view, stay put. If it doesn't all fit, the left/top edge wins.
				const pan_to = ({ left, right, top, bottom }) => {
					let x = Math.min(camera.x, VIEW.right - margin - right);
					x = Math.min(0, Math.max(x, VIEW.left + margin - left));
					let y = Math.min(camera.y, VIEW.bottom - margin - bottom);
					y = Math.min(0, Math.max(y, VIEW.top + margin - top));
					return { x, y, z: 1 };
				};

				const all = bounds([...new_drawn, ...new_arrows]);
				const fits = all.right - all.left <= W && all.bottom - all.top <= H;

				// If the arrows fit too, keep them in view. Otherwise zoom out to
				// show everything while the arrows draw, then zoom back in on the
				// new rows and result.
				const nudge = CAMERA_NUDGE[click] ?? {};
				const target = fits ? all : bounds(new_drawn);
				const target_fits = target.right - target.left <= W && target.bottom - target.top <= H;
				const panned = nudge.center && target_fits ? {
					x: VIEW.left + margin + (W - (target.right - target.left)) / 2 - target.left,
					y: VIEW.top + margin + (H - (target.bottom - target.top)) / 2 - target.top,
					z: 1,
				} : pan_to(target);
				const final = { ...panned, x: panned.x + (nudge.x ?? 0), y: panned.y + (nudge.y ?? 0) };
				let wide = null;
				if (!fits) {
					const z = Math.min(W / (all.right - all.left), H / (all.bottom - all.top));
					wide = {
						x: VIEW.left + margin + (W - z * (all.right - all.left)) / 2 - z * all.left,
						y: VIEW.top + margin + (H - z * (all.bottom - all.top)) / 2 - z * all.top,
						z,
					};
				}

				const tf = ({ x, y, z }) => `translate(${x}px, ${y}px) scale(${z})`;
				const first = wide ?? final;
				if (first.x !== camera.x || first.y !== camera.y || first.z !== camera.z) {
					// Pan first, then play this instruction's animations. (Its
					// arrows fading on the next click are left alone.)
					for (const a of global_animations.slice(animations_before)) {

					}

					// When zoomed out, hold until the last arrow lands, then zoom in
					const hold = wide ? Math.max(ANIM.arrow, ...new_arrows.map(a => a.end)) : 0;
					const total = ANIM.pan + hold + (wide ? ANIM.pan : 0);
					global_animations.push({

						animation_duration: `${total}s`,

							0:   { transform: tf(camera) },
							[100 * ANIM.pan / total]: { transform: tf(wide) },
							[100 * (ANIM.pan + hold) / total]: { transform: tf(wide) },
							100: { transform: tf(final) },
						} : {
							0:   { transform: tf(camera) },
							100: { transform: tf(final) },
						}
					});
					camera = final;
				}
			}

				`${a.slice(0, start)}<tspan class="code-${n}">${n === "register-2" ? "<tspan class=\"thin-space\">&nbsp;</tspan>" : ""}${
					a.slice(start, end)

	function preprocess(slide_id, text, lang) {
		let start_pos = text.indexOf("\n");
		let end_pos = text.lastIndexOf("\n");

		if (text.slice(0, start_pos + 1).trim() !== "")
			start_pos = -1;

		if (text.slice(end_pos, -1).trim() !== "")
			end_pos = -1

		let lines = text
			.slice(start_pos + 1, end_pos)
			.replaceAll(/;;[^\n]+/g, "")
			.split('\n')
			.map(e => e.trimRight().replaceAll('\t', '    '));

		const unnecessary_whitespace = lines
			.filter(e => e)
			.reduce((a, c) => Math.min(a, c.length - c.trimLeft().length), Number.POSITIVE_INFINITY);

		lines = lines.map(e => e.slice(unnecessary_whitespace));
		code_snippets.set(slide_id, (code_snippets.get(slide_id) || "") +
			lines
				.join("\n")
				.replaceAll("&gt;", ">")
				.replaceAll("&lt;", "<")
				.replaceAll("&amp;", "&")
		);
		let curly_depth = 0;
		let paren_depth = 0;

		const joined_lines = lines.join('\n')
			.replaceAll("&gt;&gt;", "&raquo;")
			.replaceAll("&lt;&lt;", "&laquo;")
			.replaceAll("-&gt;", "&RightArrow;")
			.replaceAll(" =&gt; ", " &rArr; ")
			.replaceAll(" != ", " &ne; ")
			.replaceAll(" &lt;= ", " &le; ")
			.replaceAll(" &gt;= ", " &ge; ")

			.replaceAll("&lt;", "<")
			.replaceAll("&gt;", ">");

		const ranges = new Array();

		// for (; )
		// for (let regex = /".+?"/g, cur = regex.exec(joined_lines); cur; cur = regex.exec(joined_lines));

		// const meme = RegExp.prototype.exec.bind(/".+?"/g, joined_lines);
		// joined_lines;

		const in_match = new Array(joined_lines.length).fill(false);

		if (lang === 'zig' || lang === 'ziggy') {
			// console.log(joined_lines);

			// let pos = 0;
			for (const match of joined_lines.matchAll(lang === "ziggy"
			? /\/\/([^_]*|$)|"[^_]*?(?<!\\)"|'[^_]*?'|\\\\([^_]*|$)/g
			: /\/\/([^\n]*|$)|"[^\n]*?(?<!\\)"|'[^\n]*?'|\\\\([^\n]*|$)/g)) {
				const { index, 0: { length } } = match;
				for (let q = 0; q < length; q++) in_match[index + q] = true;

			}



			// for (const [regex, name] of [
			// 	[/\/\/([^\n]*|$)/g, "comment"],

			// 		for (let q = 0; q < length; q++) if (in_match[index + q]) continue outer;
			// 		for (let q = 0; q < length; q++) in_match[index + q] = true;
			// 		ranges.push([name, index, index + length]);
			// 	}
			// }

			for (const [regex, name] of [
				[/(?<!\w)(usingnamespace|linksection|threadlocal|unreachable|addrspace|allowzero|nosuspend|anyframe|callconv|comptime|continue|errdefer|noinline|volatile|anytype|noalias|suspend|export|undefined|extern|inline|opaque|orelse|packed|false|true|null|resume|return|struct|switch|align|async|await|break|catch|const|defer|error|union|while|else|enum|test|and|asm|for|pub|try|var|fn|if|or)(?!\w)/g, "keyword"],
				[/(?<!\w)(Carry|HHID|Foo|Bar|Allocator|IndexItem|FastDivider32|IpAddress|V|T|V64u8|V8u64)(?!\w+)/g, "struct-type"],
				[/@\w+/g, "builtin"],

				[/(?<=\.)\*/g, "symbol-2"],
				[/\w+(?=\()|(?<=fn )\w+/g, "func-name"],
				[/(?<!\w)(?:[ui]\d+|void|bool|u?int|[ui]size)(?!\w)/g, "type"],
				[/(?<!\w)0x[\dA-Fa-f]+/g, "num"],
				[/(?<!\w)(?:0[b])?\d+/g, "num"],
				[/\*/g, "star"],
			]) {
				outer: for (const { index, 0: { length } } of joined_lines.matchAll(regex)) {
					for (let q = 0; q < length; q++) if (in_match[index + q]) continue outer;
					for (let q = 0; q < length; q++) in_match[index + q] = true;
					ranges.push([name, index, index + length]);
				}
			}
		} else if (lang === "asm") {
			for (const [regex, name] of [
				[/;[^\n]*/g, "comment"],
				[/"[^\n]+?"|'[^\n]+?'/g, "string"],

				outer: for (const { index, 0: { length } } of joined_lines.matchAll(regex)) {
					for (let q = 0; q < length; q++) if (in_match[index + q]) continue outer;
					for (let q = 0; q < length; q++) in_match[index + q] = true;

				[/\*/g, "star"],
				[/(?<!\w)(?:[re]?[abcd]x|[abcd][hl]|[er]?[sb]p|[er]?[ds]i|r[89][bwd]?|r1[0-5][bwd]?|[xyz]mm[0-9]|zmm[12][0-9]|[xy]mm1[0-5]|zmm3[01]|rip)(?!\w)/g, "register"],
				[/(?<=\{)(?:z|k[0-7])(?=\})/g, "register-2"],

				[/(?<!\w)-?\d+/g, "num"],

			}

			let cur_color = 0;
			for (let i = 0; i < joined_lines.length; ) {

// Critically damped (no overshoot, fastest)
const STIFFNESS_DEFAULT = 25;
const zeta = 1; // critical
const DAMPING_DEFAULT = 2 * Math.sqrt(STIFFNESS_DEFAULT) * zeta; // ≈ 10

// Slightly overdamped (no overshoot, a bit “heavier” feel)

function springTween(line, from, to, opts = {}) {
  let state = { ...from };
  let velocity = { x1: 0, y1: 0, x2: 0, y2: 0 };

  const stiffness = opts.stiffness ?? STIFFNESS_DEFAULT;   // spring strength (per second)
  const damping   = opts.damping   ?? DAMPING_DEFAULT;    // damping (per second)
  const delay   = opts.delay   ?? 0;    // damping (per second)

  const my_thread_id = my_thread.id;
  let lastTime = null;

  function animate(timestamp) {
    if (lastTime === null) lastTime = timestamp + delay * 1000;
	let done = false;
	if (timestamp >= lastTime) {
		const deltaMs = timestamp - lastTime;
		const dt = deltaMs / 500;       // convert to seconds
		lastTime = timestamp;

		done = true;

		if (my_thread_id === my_thread.id) {
			line.setAttribute("opacity", 1);
			for (let key in state) {
				// displacement
				const dist = to[key] - state[key];

				// spring force (Hooke's law) scaled by dt
				const springForce = dist * stiffness;

				// damping force scaled by velocity
				const dampingForce = velocity[key] * damping;

				// acceleration
				const accel = springForce - dampingForce;

				// integrate velocity & position
				velocity[key] += accel * dt;
				state[key] += velocity[key] * dt;

				// check if still moving noticeably
				if (Math.abs(dist) > 0.1 || Math.abs(velocity[key]) > 0.01) {
					done = false;
				}
			}
		}
	} else {
		if (my_thread_id === my_thread.id)
  			line.setAttribute("opacity", 0);
	}

    if (done) {
      applyState(line, to);
    } else {
      applyState(line, state);
      requestAnimationFrame(animate);
    }
  }

  if (from.x1 !== to.x1 ||
  	  from.x2 !== to.x2 ||
  	  from.y1 !== to.y1 ||
  	  from.y2 !== to.y2)
  	requestAnimationFrame(animate);
}

	window.addEventListener("keydown", function (event) {
		// Do nothing if the event was already processed
		if (event.defaultPrevented) return;

		switch (event.key) {
		case "ArrowLeft":
			goBackward();
			break;
		case "ArrowRight":
			goForward();
			break;
		case "Control":
			is_control_depressed = true;
			break;
		case 'c':
			if (is_control_depressed) {
				navigator.clipboard.writeText(code_snippets.get(cur_slide));
			}
		default:
			return; // Quit when this doesn't handle the key event.
		}

		// Cancel the default action to avoid it being handled twice
		event.preventDefault();
	}, true);

	applyTransitions();
	updateURL();
	applyStateTransitionsUpToCurrentClickInSlide();
	updateContainerSlideAttribute();
	for (const slide of slidesById.get(cur_slide)) slide.setAttribute("present-went-forward", "");
</script>

function subtractBinary(a, b) {
    // Convert binary strings to integers
    const intA = BigInt(`0b${[...a.replaceAll('.', '0')].reverse().join('')}`);
    const intB = BigInt(`0b${[...b.replaceAll('.', '0')].reverse().join('')}`);

    // Subtract
    let result = intA - intB;
	const flip_around = result < 0n;

    // If negative, handle appropriately
    if (flip_around) {
        result = ~result;
    }

	let str = result.toString(2).padStart(64, '0');

	if (flip_around) {
        str = str.replaceAll(/[01]/g, e => ['1', '0'][+e]);
    }

    // Convert back to binary string
    return [...str.replaceAll('0', '.')].reverse().join('');
}

function opBinary(a, b, op) {
    // Convert binary strings to integers
    const intA = BigInt(`0b${[...a.replaceAll('.', '0')].reverse().join('')}`);
    const intB = BigInt(`0b${[...b.replaceAll('.', '0')].reverse().join('')}`);

    // Subtract

    let result = undefined;

	switch (op) {
		case '-': result = intA - intB; break;
		case '^': result = intA ^ intB; break;
		case '&': result = intA & intB; break;
		case '&~': result = intA & ~intB; break;
		case '|': result = intA | intB; break;
	}

	const flip_around = result < 0n;

    // If negative, handle appropriately
    if (flip_around) {
        result = ~result;
    }

	let str = result.toString(2).padStart(64, '0');

	if (flip_around) {
        str = str.replaceAll(/[01]/g, e => ['1', '0'][+e]);
    }

    // Convert back to binary string
    return [...str.replaceAll('0', '.')].reverse().join('');
}
